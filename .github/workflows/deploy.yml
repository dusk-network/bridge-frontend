name: Deploy

# main goes to testnet, as it's pushed or the workflow is run on it: the
# attestation names main. A release's bridge-v* tag goes to mainnet, only
# once the DEPLOY_MAINNET repository variable is "true"; the cloudflare
# environment, whose token deploys, takes main and bridge-v* tags alone. Each
# is built with its site's settings in deployments.json, as
# scripts/verify-build.js rebuilds it.
on:
  push:
    branches: ["main"]
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_type == 'tag' && 'mainnet' || 'testnet' }}
    if: >-
      (github.ref_type == 'branch' && github.ref_name == 'main') ||
      (github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'bridge-v') &&
      vars.DEPLOY_MAINNET == 'true')
    # GitHub-hosted, for a clean machine around the Cloudflare token.
    runs-on: ubuntu-latest
    # The token is this environment's, which only main and bridge-v* tags can
    # use.
    environment: cloudflare
    # GitHub signs the build manifest's attestation with this workflow's own
    # identity, for this commit: no key to keep.
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      NETWORK: ${{ github.ref_type == 'tag' && 'mainnet' || 'testnet' }}
      SITE: ${{ github.ref_type == 'tag' && 'https://bridge.dusk.network/' || 'https://bridge.testnet.dusk.network/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setting up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The attestation of a release's build names its tag, which
      # scripts/verify-build.js looks for by the version its manifest says.
      - name: Checking the tag names the version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "bridge-v$version" ]; then
            echo "::error::package.json says $version: a release of it is tagged bridge-v$version"
            exit 1
          fi

      # The Cloudflare CLI's lockfile too, which no pull request's CI checks,
      # each with its own emergency exceptions: the check refuses one that
      # isn't used.
      - name: Validate package release ages
        run: |
          node scripts/verify-package-release-ages.js --days 0.5
          node scripts/verify-package-release-ages.js --days 0.5 --lockfile deploy/package-lock.json --exceptions deploy/.npm-release-age-exceptions.json

      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Installing dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix deploy

      - name: Verify registry signatures
        run: |
          npm audit signatures
          cd deploy && npm audit signatures

      # This commit's tests and production audit, as CI runs them, here, on
      # the commit deployed: a push to main and a tag alike, before anything is
      # attested or deployed. No other workflow's result is waited for.
      - name: Checking the commit
        run: npm run check

      - name: Taking the site's settings from `deployments.json`
        run: node scripts/deployment-env.js "$SITE" >> "$GITHUB_ENV"

      # As scripts/verify-build.js rebuilds it, with those settings alone.
      - name: Building the app
        run: npm run build

      # GitHub vouches for the manifest, not the site that serves it: this
      # workflow built it from this commit. scripts/verify-build.js
      # --attested checks a site's against it. GitHub attests the builds of a
      # private repository only on Enterprise Cloud, so while this one is
      # private, the step after this one says so instead.
      - name: Attesting the build's manifest
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/build-manifest.json

      - name: Not attesting the build's manifest, as the repository is private
        if: github.event.repository.private != false
        run: echo "::notice title=Not attested::$GITHUB_REPOSITORY is private, so this build's manifest isn't attested, and scripts/verify-build.js --attested can't check the site. Without --attested, it still rebuilds the site and compares. Once the repository is public, each deploy attests its build."

      # Cloudflare serves deploy/site/: the build, beside the headers for it.
      - name: Placing the build where Cloudflare serves it
        run: node deploy/stage.js

      - name: Deploying to Cloudflare
        run: deploy/node_modules/.bin/wrangler deploy --env "$NETWORK"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
